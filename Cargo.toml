[package]
name = "task_api"
version = "0.1.0"
edition = "2024"

[dependencies]
# Framework web asynchrone
axum = { version = "0.7", features = ["macros"] }
# Runtime asynchrone
tokio = { version = "1", features = ["full"] }
# Base de données PostgreSQL (avec vérification SQL à la compilation)
sqlx = { version = "0.8", features = [
"runtime-tokio",
"postgres",
"uuid",
"chrono",
"migrate",
] }
# Sérialisation / désérialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Gestion d’erreurs ergonomique
thiserror = "1"
# Variables d’environnement depuis .env
dotenvy = "0.15"
# Logging structuré
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"]
}
# Génération de la documentation OpenAPI
utoipa = { version = "4", features = ["axum_extras", "uuid",
"chrono"] }
utoipa-swagger-ui = { version = "6", features = ["axum"] }
# Types supplémentaires
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Gestion des erreurs HTTP
axum-extra = { version = "0.9", features = ["typed-header"] }
[dev-dependencies]
# Client HTTP pour les tests d’intégration
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
